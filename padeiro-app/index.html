<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BJJ APP</title>

<!-- ▼▼▼ COLE AQUI O LINK /exec DO SEU PORTAL ▼▼▼ -->
<script>
 var EXEC_URL = "https://script.google.com/macros/s/AKfycbwMGQMo5_iDgAoxGwHtFoHPxqkEwvFUDbJacpx3XnNmbx0Mc-QmWKREwmWyNOWh3Ww/exec";
</script>
<!-- ▲▲▲ (ex.: https://script.google.com/macros/s/AKfy.../exec ) ▲▲▲ -->

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b5bd7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BJJ APP">
<style>
  html,body{margin:0;height:100%;background:#ffffff;overflow:hidden}
  #frame{border:0;width:100%;height:100%;display:block}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:#ffffff;transition:opacity .4s}
  #load.hide{opacity:0;pointer-events:none}
  #load img{width:120px;height:120px;border-radius:26px;box-shadow:0 10px 30px rgba(43,91,215,.22)}
  .sp{width:30px;height:30px;border:4px solid #e9e5dc;border-top-color:#2b5bd7;border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  .erro{font-family:system-ui,sans-serif;color:#d64545;padding:24px;text-align:center;max-width:320px}
</style>
</head>
<body>
  <div id="load"><img src="icon-512.png" alt="BJJ APP"><div class="sp"></div></div>
  <iframe id="frame" allow="camera;clipboard-write" title="Portal do Aluno"></iframe>
<script>
  (function(){
    if(!EXEC_URL || EXEC_URL.indexOf("COLE_AQUI") === 0){
      document.getElementById('load').innerHTML =
        '<div class="erro">Configure o link do portal na variável <b>EXEC_URL</b> dentro do index.html.</div>';
      return;
    }
    var f = document.getElementById('frame');
    f.addEventListener('load', function(){ document.getElementById('load').classList.add('hide'); });
    f.src = EXEC_URL;
    // de reserva: se o iframe não carregar em 12s, abre direto
    setTimeout(function(){
      if(!document.getElementById('load').classList.contains('hide')){ window.location.replace(EXEC_URL); }
    }, 12000);
    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
    }
  })();
</script>
</body>
</html>
